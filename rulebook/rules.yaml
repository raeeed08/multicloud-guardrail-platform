# One rulebook, enforced at three points:
#   PREVENT  - in the pull request: custom Rego policies (Conftest) + Checkov read the Terraform code
#   GUARD    - in the cloud control plane: Azure Policy assignments and AWS SCPs refuse the change at the API
#   DETECT   - at runtime: Cloud Copilot scans the live accounts with the mapped rule IDs
#
# Fields
#   prevent.<cloud>.policy     Rego file that implements the rule
#   prevent.<cloud>.resources  Terraform resource types the policy reads
#   guard.<cloud>              control-plane guardrail deployed by the landing zone (if any)
#   detect.copilot             Cloud Copilot rule IDs that find the same problem in a running account
#   frameworks                 CIS benchmark / NIST 800-53 references (indicative mapping)
version: 2
rules:
  - id: NET-001
    title: No SSH or RDP open to the internet
    severity: critical
    category: network
    why: >
      Internet-wide exposure of administration ports (22, 3389) is the most common entry point for brute force and
      credential stuffing, and the first link of most cloud attack paths.
    fix_hint: Restrict the source to a trusted range, or remove the rule and use SSM Session Manager / Azure Bastion.
    prevent:
      aws:
        policy: policies/aws/network.rego
        resources: [aws_security_group, aws_security_group_rule, aws_vpc_security_group_ingress_rule]
      azure:
        policy: policies/azure/network.rego
        resources: [azurerm_network_security_group, azurerm_network_security_rule]
    detect:
      copilot: [EC2-001, AZ-NSG-001]
    frameworks: {cis_aws: ["5.2", "5.3"], cis_azure: ["6.1", "6.2"], nist: [SC-7, AC-17]}

  - id: NET-002
    title: No database or cluster port open to the internet
    severity: critical
    category: network
    why: Databases and caches reachable from anywhere are scanned continuously; one weak password means a data breach.
    fix_hint: Allow the port only from the application subnet or security group; use private endpoints.
    prevent:
      aws:
        policy: policies/aws/network.rego
        resources: [aws_security_group, aws_security_group_rule, aws_vpc_security_group_ingress_rule]
      azure:
        policy: policies/azure/network.rego
        resources: [azurerm_network_security_group, azurerm_network_security_rule]
    detect:
      copilot: [EC2-002, AZ-NSG-002]
    frameworks: {nist: [SC-7]}

  - id: NET-003
    title: No rule opening every port to the internet
    severity: high
    category: network
    why: An "allow all" rule silently exposes every service started later on the host.
    fix_hint: Replace with explicit ports (for example 443 only).
    prevent:
      aws:
        policy: policies/aws/network.rego
        resources: [aws_security_group, aws_security_group_rule, aws_vpc_security_group_ingress_rule]
      azure:
        policy: policies/azure/network.rego
        resources: [azurerm_network_security_group, azurerm_network_security_rule]
    detect:
      copilot: [EC2-003, AZ-NSG-003]
    frameworks: {nist: [SC-7]}

  - id: STO-001
    title: Object storage is never public
    severity: critical
    category: storage
    why: Public buckets and containers are the classic cloud data leak.
    fix_hint: >
      AWS: enable all four Block Public Access settings and never use public ACLs.
      Azure: set allow_nested_items_to_be_public = false.
    prevent:
      aws:
        policy: policies/aws/storage.rego
        resources: [aws_s3_bucket_public_access_block, aws_s3_account_public_access_block, aws_s3_bucket_acl]
      azure:
        policy: policies/azure/storage.rego
        resources: [azurerm_storage_account]
    guard:
      aws: SCP deny-s3-public-access-changes
      azure: Azure Policy "Storage account public access should be disallowed"
    detect:
      copilot: [S3-001, S3-002, S3-003, AZ-STOR-001]
    frameworks: {cis_aws: ["2.1.4"], cis_azure: ["3.7"], nist: [AC-3, AC-21]}

  - id: STO-002
    title: Storage only accepts encrypted connections (TLS 1.2+)
    severity: medium
    category: storage
    why: Plain HTTP or old TLS exposes data and keys in transit.
    fix_hint: >
      Azure: https_traffic_only_enabled = true and min_tls_version = "TLS1_2".
      AWS: the secure bucket module adds a bucket policy denying aws:SecureTransport = false.
    prevent:
      azure:
        policy: policies/azure/storage.rego
        resources: [azurerm_storage_account]
    guard:
      azure: Azure Policy "Secure transfer to storage accounts should be enabled"
    detect:
      copilot: [S3-004, AZ-STOR-002, AZ-STOR-003]
    frameworks: {cis_azure: ["3.1", "3.15"], nist: [SC-8]}

  - id: STO-003
    title: Storage accounts are not reachable from all networks
    severity: medium
    category: storage
    why: A storage endpoint open to every network only depends on keys and SAS tokens never leaking.
    fix_hint: Set public_network_access_enabled = false (private endpoint) or network_rules default_action = "Deny".
    prevent:
      azure:
        policy: policies/azure/storage.rego
        resources: [azurerm_storage_account]
    detect:
      copilot: [AZ-STOR-005]
    frameworks: {cis_azure: ["3.8"], nist: [SC-7]}

  - id: ENC-001
    title: Disks and databases are encrypted at rest
    severity: high
    category: encryption
    why: Unencrypted volumes and snapshots can be copied and read outside your control.
    fix_hint: "AWS: encrypted = true / storage_encrypted = true. Azure: encryption_at_host_enabled = true on VMs."
    prevent:
      aws:
        policy: policies/aws/encryption.rego
        resources: [aws_ebs_volume, aws_db_instance, aws_rds_cluster]
      azure:
        policy: policies/azure/compute.rego
        resources: [azurerm_linux_virtual_machine, azurerm_windows_virtual_machine]
    guard:
      aws: aws_ebs_encryption_by_default (security baseline module)
    detect:
      copilot: [EBS-001, EBS-002, RDS-002, AZ-VM-002]
    frameworks: {cis_aws: ["2.2.1", "2.3.1"], nist: [SC-28]}

  - id: ENC-002
    title: Encryption keys rotate automatically
    severity: medium
    category: encryption
    why: Rotation limits how much data a single compromised key version protects.
    fix_hint: "AWS: enable_key_rotation = true. Azure: add a rotation_policy to Key Vault keys."
    prevent:
      aws:
        policy: policies/aws/encryption.rego
        resources: [aws_kms_key]
      azure:
        policy: policies/azure/keyvault.rego
        resources: [azurerm_key_vault_key]
    detect:
      copilot: [KMS-001]
    frameworks: {cis_aws: ["3.6"], nist: [SC-12]}

  - id: KV-001
    title: Secret stores are recoverable and private
    severity: medium
    category: secrets
    why: Without purge protection one mistake or one attacker deletes every secret for good.
    fix_hint: >
      Azure: purge_protection_enabled = true, public_network_access_enabled = false, RBAC authorization.
      AWS: keep a recovery window on Secrets Manager secrets (never 0).
    prevent:
      aws:
        policy: policies/aws/encryption.rego
        resources: [aws_secretsmanager_secret]
      azure:
        policy: policies/azure/keyvault.rego
        resources: [azurerm_key_vault]
    detect:
      copilot: [AZ-KV-001, AZ-KV-002, AZ-KV-003]
    frameworks: {cis_azure: ["8.5", "8.6"], nist: [CP-9, SC-12]}

  - id: DB-001
    title: Databases are never publicly reachable
    severity: critical
    category: database
    why: A public database endpoint turns a password into the only line of defence.
    fix_hint: >
      AWS: publicly_accessible = false. Azure: public_network_access_enabled = false and no 0.0.0.0-255.255.255.255
      firewall rule; use private endpoints.
    prevent:
      aws:
        policy: policies/aws/database.rego
        resources: [aws_db_instance]
      azure:
        policy: policies/azure/database.rego
        resources: [azurerm_mssql_server, azurerm_mssql_firewall_rule, azurerm_postgresql_flexible_server]
    detect:
      copilot: [RDS-001, AZ-SQL-001]
    frameworks: {cis_azure: ["4.1.2"], nist: [SC-7]}

  - id: IAM-001
    title: No standing administrator access
    severity: high
    category: identity
    why: Permanent admin rights turn any stolen credential into a full account takeover.
    fix_hint: >
      Grant least-privilege roles; use just-in-time elevation (AWS IAM Identity Center permission sets with
      short sessions, Azure PIM) for admin tasks.
    prevent:
      aws:
        policy: policies/aws/identity.rego
        resources: [aws_iam_user_policy_attachment, aws_iam_role_policy_attachment, aws_iam_group_policy_attachment, aws_iam_policy_attachment]
      azure:
        policy: policies/azure/identity.rego
        resources: [azurerm_role_assignment]
    detect:
      copilot: [IAM-009]
    frameworks: {cis_aws: ["1.16"], nist: [AC-6]}

  - id: IAM-002
    title: No long-lived cloud credentials
    severity: high
    category: identity
    why: Static keys leak through repositories, laptops and CI logs; federated short-lived tokens do not.
    fix_hint: Use roles, managed identities and OIDC federation (GitHub Actions) instead of access keys or client secrets.
    prevent:
      aws:
        policy: policies/aws/identity.rego
        resources: [aws_iam_access_key]
      azure:
        policy: policies/azure/identity.rego
        resources: [azuread_application_password, azuread_service_principal_password]
    detect:
      copilot: [IAM-005, IAM-006, IAM-007]
    frameworks: {cis_aws: ["1.14"], nist: [IA-5]}

  - id: LOG-001
    title: Audit logs are complete, tamper-evident and retained
    severity: high
    category: logging
    why: Without a complete audit trail an intrusion can neither be detected nor investigated.
    fix_hint: >
      AWS: multi-region CloudTrail with log file validation and KMS. Retain logs at least 90 days
      (CloudWatch log groups, Log Analytics workspaces).
    prevent:
      aws:
        policy: policies/aws/logging.rego
        resources: [aws_cloudtrail, aws_cloudwatch_log_group]
      azure:
        policy: policies/azure/logging.rego
        resources: [azurerm_log_analytics_workspace]
    detect:
      copilot: [CT-001, CT-002, CT-004, AZ-MON-001]
    frameworks: {cis_aws: ["3.1", "3.2", "3.5"], cis_azure: ["5.1.1"], nist: [AU-2, AU-9, AU-11]}

  - id: CMP-001
    title: Compute instances are hardened against credential theft
    severity: medium
    category: compute
    why: IMDSv1 lets an SSRF bug steal the instance role; password SSH invites brute force.
    fix_hint: "AWS: metadata_options { http_tokens = \"required\" }. Azure: disable_password_authentication = true."
    prevent:
      aws:
        policy: policies/aws/compute.rego
        resources: [aws_instance, aws_launch_template]
      azure:
        policy: policies/azure/compute.rego
        resources: [azurerm_linux_virtual_machine]
    guard:
      aws: SCP require-imdsv2
    detect:
      copilot: [EC2-005, AZ-VM-001]
    frameworks: {cis_aws: ["5.6"], nist: [AC-3, IA-2]}

  - id: TAG-001
    title: Every resource carries owner, environment and project tags
    severity: low
    category: governance
    why: Untagged resources have no owner, no cost centre and no one to call during an incident.
    fix_hint: "AWS: provider default_tags. Azure: tags on every resource group (required by Azure Policy)."
    prevent:
      aws:
        policy: policies/aws/tagging.rego
        resources: [provider.aws.default_tags]
      azure:
        policy: policies/azure/tagging.rego
        resources: [azurerm_resource_group]
    guard:
      azure: Azure Policy "Require a tag on resource groups"
    frameworks: {nist: [CM-8]}

  - id: GOV-001
    title: Workloads stay in approved regions
    severity: medium
    category: governance
    why: Data residency (GDPR) and a smaller attack surface; unused regions are where crypto-miners hide.
    fix_hint: Enforced once by the organisation, not by each project.
    guard:
      aws: SCP deny-unapproved-regions
      azure: Azure Policy "Allowed locations"
    frameworks: {nist: [AC-3, SA-9]}
